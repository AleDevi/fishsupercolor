name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    # Windows + Python 3.12 + the hash-locked packages: the same set-up as install_windows.bat
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-win.txt
      - name: Install locked packages
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-win.txt
          python -m pip install --no-deps --no-build-isolation .
          python -m pip install pytest==9.1.1
      - name: Run tests
        run: python -m pytest -q -p no:cacheprovider tests
